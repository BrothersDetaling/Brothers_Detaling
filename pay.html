
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Przekierowanie do płatności</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="png" href="Img/icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">


</head>

<section>
<div class="container">
    <div class="grid">
        <div class="card normal">
            <div class="card-top">
                <h3>Przekierowanie do płatności...</h3>
            </div>
        </div>
    </div>
</div>
</section>


<script>
    const SUPABASE_URL = "https://dvaeypdoxkldomgewvyf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2YWV5cGRveGtsZG9tZ2V3dnlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNzkyNzgsImV4cCI6MjA5NDk1NTI3OH0.sbquV3e3NVXly4faRTM0l3MN2DQWk5Z7xpw6ByOsSdk";

    function getBookingId() {
        const urlBookingId = new URLSearchParams(window.location.search).get("booking_id");
        if (urlBookingId) return urlBookingId;

        const booking = JSON.parse(localStorage.getItem("booking") || "null");
        return booking?.booking_id || null;
    }

    function getStoredBooking() {
        return JSON.parse(localStorage.getItem("booking") || "null");
    }

    function setError(title, message) {
        document.querySelector(".card-top h3").textContent = title;
        document.querySelector(".card.normal p")?.remove();
        const paragraph = document.createElement("p");
        paragraph.textContent = message;
        document.querySelector(".card.normal")?.appendChild(paragraph);
    }

    async function run() {
        const bookingId = getBookingId();
        const storedBooking = getStoredBooking();
        const fallbackUrl = new URL("main.html", window.location.href);
        const successUrl = new URL("success.html", window.location.href);

        if (!bookingId) {
            setError("Brak danych rezerwacji", "Wróć do formularza i utwórz rezerwację ponownie.");
            return;
        }

        successUrl.searchParams.set("booking_id", bookingId);
        fallbackUrl.searchParams.set("booking_id", bookingId);

        const booking = {
            booking_id: bookingId,
            is_paid: Boolean(storedBooking?.is_paid),
            firstName: storedBooking?.firstName || "",
            lastName: storedBooking?.lastName || "",
            phone: storedBooking?.phone || "",
            email: storedBooking?.email || "",
            carModel: storedBooking?.carModel || "",
            carSize: storedBooking?.carSize || "",
            day: storedBooking?.day || "",
            time: storedBooking?.time || "",
            totalAmount: Number(storedBooking?.totalAmount) || 0,
            totalDurationMinutes: Number(storedBooking?.totalDurationMinutes) || 0,
            items: Array.isArray(storedBooking?.items) ? storedBooking.items : [],
            success_url: successUrl.href,
            cancel_url: fallbackUrl.href
        };

        fetch("https://dvaeypdoxkldomgewvyf.supabase.co/functions/v1/super-endpoint", {
            method: "POST",
            headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json",
                Accept: "application/json"
            },
            body: JSON.stringify(booking)
        })
            .then(async (response) => {
                const responseText = await response.text();
                const data = responseText ? JSON.parse(responseText) : {};

                if (!response.ok) {
                    throw new Error(data?.error || `Edge Function HTTP ${response.status}: ${responseText}`);
                }

                return data;
            })
            .then((data) => {
                if (!data?.url) {
                    throw new Error("Brak adresu przekierowania do płatności");
                }

                window.location.href = data.url;
            })
            .catch((error) => {
                console.error("Nie udało się uruchomić płatności:", error);
                setError("Błąd przekierowania", "Nie udało się uruchomić płatności. Spróbuj ponownie.");
            });
    }

    run();
</script>

</html>
