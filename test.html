<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularz</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #666;
        }

        .form-box {
            max-width: 900px;
            margin: 0 auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px 22px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field input {
            border: none;
            border-bottom: 1px solid #cfcfcf;
            padding: 8px 4px 6px;
            font-size: 15px;
            color: #444;
            background: transparent;
            outline: none;
        }

        .field input::placeholder {
            color: #8a8a8a;
        }

        .field input:focus {
            border-bottom-color: #888;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="form-box">
        <form class="form-grid">
            <div class="field">
                <input type="text" placeholder="Imię" />
            </div>

            <div class="field">
                <input type="text" placeholder="Nazwisko" />
            </div>

            <div class="field">
                <input type="tel" placeholder="+48Numer telefonu" />
            </div>

            <div class="field">
                <input type="text" placeholder="Numer domu/bloku" />
            </div>

            <div class="field">
                <input type="text" placeholder="Ulica" />
            </div>

            <div class="field">
                <input type="text" placeholder="Kod pocztowy" />
            </div>

            <div class="field">
                <input type="text" placeholder="Miejscowość" />
            </div>
        </form>
    </div>
</body>

</html>
