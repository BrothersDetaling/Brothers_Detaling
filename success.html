<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Brothers Detailing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="png" href="Img/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
</head>
<body>
  <section>
    <div class="container">
      <div class="card normal">
        <div class="card-top">
          <h3 id="status-title">Potwierdzanie płatności...</h3>
        </div>
        <p id="status-message">Trwa aktualizacja statusu rezerwacji.</p>
      </div>
    </div>
  </section>

  <script>
    function getBookingId() {
      const booking = JSON.parse(localStorage.getItem("booking") || "null");
      const fromStorage = booking?.booking_id || null;
      const fromQuery = new URLSearchParams(window.location.search).get("booking_id");
      return fromQuery || fromStorage;
    }

    function run() {
      const bookingId = getBookingId();
      const titleEl = document.getElementById("status-title");
      const messageEl = document.getElementById("status-message");

      if (!bookingId) {
        titleEl.textContent = "Brak identyfikatora rezerwacji";
        messageEl.textContent = "Nie udało się potwierdzić płatności, bo brak numeru rezerwacji.";
        return;
      }

      const booking = JSON.parse(localStorage.getItem("booking") || "null");
      if (booking) {
        booking.payment_status = "pending_webhook_confirmation";
        localStorage.setItem("booking", JSON.stringify(booking));
      }

      titleEl.textContent = "Płatność przyjęta";
      messageEl.textContent = "Status rezerwacji zostanie zaktualizowany automatycznie po potwierdzeniu płatności przez Stripe.";
    }

    run();
  </script>
</body>
</html>
